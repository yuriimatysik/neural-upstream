name: Build Windows DLLs
on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned DirectX Shader Compiler
        run: |
          curl -L --fail --retry 3 -o /tmp/linux-dxc.tar.gz \
            https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2602.24/linux_dxc_2026_05_26.x86_64.tar.gz
          echo '928b3e9986d11dc4279050e02340950c29bcbd1e5efb9d3ded9669dade37639d  /tmp/linux-dxc.tar.gz' | sha256sum -c -
          mkdir -p /tmp/dxc
          tar -xzf /tmp/linux-dxc.tar.gz -C /tmp/dxc
      - name: Test lifecycles, scale math and all HLSL entry points
        env:
          DXC: /tmp/dxc/bin/dxc
          LD_LIBRARY_PATH: /tmp/dxc/lib
        run: sh tests/run.sh
      - name: Install Windows cross compiler
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64-posix
      - name: Fetch pinned SDK headers and source
        run: sh scripts/fetch-dependencies.sh
      - name: Build ReShade add-on and standalone DLLs
        env:
          CXX: x86_64-w64-mingw32-g++-posix
        run: |
          sh build.sh
          sh proxy/build.sh
      - name: Verify Windows x64 binaries and exports
        run: |
          for binary in nvngx.dll.addon64 proxy/nvngx.dll.nr proxy/version.dll; do
            x86_64-w64-mingw32-objdump -f "$binary" | grep -q 'pei-x86-64'
            x86_64-w64-mingw32-objdump -p "$binary" > "$binary.headers.txt"
          done
          grep -q nr_host_device proxy/nvngx.dll.nr.headers.txt
          grep -q nr_host_queue proxy/nvngx.dll.nr.headers.txt
          grep -q GetFileVersionInfoW proxy/version.dll.headers.txt
          sha256sum nvngx.dll.addon64 proxy/nvngx.dll.nr proxy/version.dll > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: neural-upstream-windows-x64
          if-no-files-found: error
          path: |
            nvngx.dll.addon64
            proxy/nvngx.dll.nr
            proxy/version.dll
            SHA256SUMS
            BUILDING.md
            LICENSE
            external/minhook/LICENSE.txt

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: neural-upstream-windows-x64
      - name: Stage flat release assets and checksums
        run: |
          mkdir release-assets
          cp nvngx.dll.addon64 proxy/nvngx.dll.nr proxy/version.dll BUILDING.md LICENSE release-assets/
          cp external/minhook/LICENSE.txt release-assets/MinHook-LICENSE.txt
          cd release-assets
          sha256sum nvngx.dll.addon64 nvngx.dll.nr version.dll > SHA256SUMS
      - name: Attach the build to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          fail_on_unmatched_files: true
          files: |
            release-assets/nvngx.dll.addon64
            release-assets/nvngx.dll.nr
            release-assets/version.dll
            release-assets/SHA256SUMS
            release-assets/BUILDING.md
            release-assets/LICENSE
            release-assets/MinHook-LICENSE.txt
